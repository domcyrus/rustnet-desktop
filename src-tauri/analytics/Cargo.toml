[package]
name = "rustnet-analytics"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Local traffic history from RustNet metadata"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
rusqlite = { version = "0.40.1", default-features = false, features = ["bundled", "cache"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
