name: Desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded PRs can stop; pushes and manual runs remain independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcap-dev libelf-dev zlib1g-dev clang llvm pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - run: pnpm install --frozen-lockfile
      - name: Prepare pinned engine source for caching
        id: engine-source
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { prepareEngineSource } from './scripts/engine-source.mjs';
          const workspace = prepareEngineSource(process.cwd());
          appendFileSync(process.env.GITHUB_OUTPUT, `workspace=${workspace}\n`);
          JS
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            src-tauri -> target
            ${{ steps.engine-source.outputs.workspace }} -> target
          # Share trusted main caches with PRs without storing a cache per PR.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: pnpm run prepare:engine
      - run: pnpm run check:engine
      - run: pnpm run build
      - run: pnpm run test:engine-source
      - run: pnpm test
      - run: pnpm audit
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo build --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo install cargo-audit --locked
      - run: cargo audit --file src-tauri/Cargo.lock

  macos-helper:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Prepare pinned engine source for caching
        id: engine-source
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { prepareEngineSource } from './scripts/engine-source.mjs';
          const workspace = prepareEngineSource(process.cwd());
          appendFileSync(process.env.GITHUB_OUTPUT, `workspace=${workspace}\n`);
          JS
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            src-tauri -> target
            ${{ steps.engine-source.outputs.workspace }} -> target
          # Share trusted main caches with PRs without storing a cache per PR.
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
      - run: pnpm run prepare:engine --release
      - run: pnpm run test:macos-helper
      - run: pnpm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: pnpm run bundle
        env:
          CI: 'true'
